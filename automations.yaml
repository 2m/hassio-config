- id: '1675322366821'
  alias: Let's Encrypt Renewal
  description: ''
  trigger:
  - platform: time
    at: 01:25:00
  condition: []
  action:
  - service: hassio.addon_restart
    data:
      addon: core_letsencrypt
  mode: single
- id: '1767553093074'
  alias: IKEA BILRESA Dual Button
  description: ''
  use_blueprint:
    path: Skaronator/ikea-bilresa-dual-button.yaml
    input:
      button1_event: event.bilresa_dual_button_button_1
      button2_event: event.bilresa_dual_button_button_2
      button1_single:
      - action: light.toggle
        metadata: {}
        target:
          entity_id: light.kajplats_e27_cws_globe_1055lm_2
        data: {}
      button1_double:
      - action: light.toggle
        metadata: {}
        target:
          entity_id: light.all_lights
        data: {}
      button1_while_holding:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.all_lights
        data:
          brightness_step_pct: 10
      button2_while_holding:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.all_lights
        data:
          brightness_step_pct: -10
      button2_holding_interval: 0.3
